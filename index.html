<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Little Question 💗</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: "Trebuchet MS", Arial, sans-serif;
    color: #71334f;
    background: linear-gradient(135deg, #ffe0eb, #ffd0e1, #f6c8f1);
}

.card {
    width: 90%;
    max-width: 560px;
    min-height: 440px;
    padding: 40px 25px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    border: 2px solid white;
    border-radius: 32px;
    background: rgba(255,255,255,.65);
    box-shadow: 0 22px 70px rgba(157,65,108,.18);
}

.eyebrow {
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
}

.bear {
    font-size: 76px;
    margin: 15px;
    animation: bob 2s infinite;
}

@keyframes bob {
    50% { transform: translateY(-9px); }
}

h1 {
    font-family: Georgia, serif;
    font-size: 45px;
    color: #9d3f68;
}

p {
    max-width: 390px;
    line-height: 1.7;
    color: #89516a;
}

.buttons {
    display: flex;
    gap: 18px;
    justify-content: center;
    align-items: center;
    width: 100%;
    min-height: 70px;
}

button {
    border: none;
    border-radius: 999px;
    padding: 15px 30px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 7px 18px rgba(143,55,95,.15);
}

#yes {
    background: #ff6f9f;
    color: white;
}

#yes:hover {
    transform: scale(1.1);
    background: #f3548c;
}

#no {
    background: white;
    color: #a75b7b;
    position: relative;
}

#message {
    min-height: 26px;
    margin-top: 20px;
    color: #a34c74;
    font-style: italic;
}

.hidden {
    display: none !important;
}

#success {
    display: none;
    animation: pop .6s ease;
}

.big-heart {
    font-size: 90px;
    animation: heartbeat 1s infinite;
}

@keyframes heartbeat {
    50% { transform: scale(1.2); }
}

@keyframes pop {
    from { opacity: 0; transform: scale(.7); }
    to { opacity: 1; transform: scale(1); }
}

.again {
    margin-top: 20px;
    background: white;
    color: #a34c74;
}

.confetti {
    position: fixed;
    top: -20px;
    pointer-events: none;
    animation: fall 3s linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}

.sparkle {
    position: fixed;
    pointer-events: none;
    animation: float 8s linear infinite;
}

@keyframes float {
    from { transform: translateY(110vh); }
    to { transform: translateY(-15vh); }
}
</style>
</head>

<body>

<div class="card">

    <section id="question">

        <div class="eyebrow">
            A VERY IMPORTANT QUESTION
        </div>

        <div class="bear">🧸💗</div>

        <h1>Do you love me?</h1>

        <p>
            I've been meaning to ask you something...
            <br>
            Choose wisely. hehe ♡
        </p>

        <div class="buttons">
            <button id="yes">YES!! 💕</button>
            <button id="no">No 🙃</button>
        </div>

        <div id="message">
            Psst... there's only one correct answer.
        </div>

    </section>

    <section id="success">

        <div class="big-heart">💖</div>

        <h1>YAYYYYY!!</h1>

        <p>
            Best answer ever!
            You've officially made this little webpage
            very happy. ♡
        </p>

        <div style="font-size:35px">
            🥹💗🧸💐
        </div>

        <button class="again" id="replay">
            Replay the moment ↻
        </button>

    </section>

</div>

<script>

const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const question = document.getElementById("question");
const success = document.getElementById("success");
const message = document.getElementById("message");
const card = document.querySelector(".card");

let attempts = 0;

const reactions = [
    "Wait—where are you going? 😭",
    "Nope, you can't catch me!",
    "Are you suuuure? 🥺",
    "The button said absolutely NOT.",
    "Hehe, try again 💗",
    "That wasn't very romantic..."
];

function moveNo() {

    attempts++;

    message.textContent =
        reactions[(attempts - 1) % reactions.length];

    const area = card.getBoundingClientRect();
    const btn = noBtn.getBoundingClientRect();

    const maxX = area.width - btn.width - 24;
    const x = 12 + Math.random() * Math.max(0, maxX);
    const y = Math.random() * 90 - 18;

    noBtn.style.position = "absolute";
    noBtn.style.left = Math.min(x, area.width - btn.width - 12) + "px";
    noBtn.style.top = (area.height * .66 + y) + "px";

    noBtn.style.transform =
        `rotate(${Math.random() * 16 - 8}deg)`;
}

// NO BUTTON RUNS AWAY

noBtn.addEventListener("pointerenter", moveNo);

noBtn.addEventListener("click", moveNo);

noBtn.addEventListener("touchstart", function(e) {
    e.preventDefault();
    moveNo();
}, { passive: false });

// YES BUTTON CELEBRATION

function celebrate() {

    question.classList.add("hidden");

    success.style.display = "block";

    for (let i = 0; i < 85; i++) {

        const bit = document.createElement("span");

        bit.className = "confetti";

        bit.textContent = ["💗", "💕", "💖", "✨", "🌸"]
            [Math.floor(Math.random() * 5)];

        bit.style.left = Math.random() * 100 + "vw";

        bit.style.fontSize =
            (13 + Math.random() * 22) + "px";

        bit.style.animationDuration =
            (2 + Math.random() * 2) + "s";

        document.body.appendChild(bit);

        setTimeout(() => bit.remove(), 5500);
    }
}

yesBtn.addEventListener("click", celebrate);

// REPLAY BUTTON

document.getElementById("replay").addEventListener("click", function() {

    success.style.display = "none";

    question.classList.remove("hidden");

    noBtn.style.position = "relative";
    noBtn.style.left = "";
    noBtn.style.top = "";
    noBtn.style.transform = "";

    attempts = 0;

    message.textContent =
        "Psst... there's only one correct answer.";

});

// FLOATING BACKGROUND HEARTS

for (let i = 0; i < 16; i++) {

    const heart = document.createElement("div");

    heart.className = "sparkle";

    heart.textContent =
        Math.random() > .5 ? "♡" : "✧";

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.fontSize =
        (16 + Math.random() * 25) + "px";

    heart.style.animationDuration =
        (7 + Math.random() * 9) + "s";

    heart.style.animationDelay =
        (-Math.random() * 12) + "s";

    document.body.appendChild(heart);
}

</script>

</body>
</html>
